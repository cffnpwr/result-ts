name: Runtime Test
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.ts"
      - "**/package.json"
      - "**/bun.lock"
      - "**/tsconfig.json"
      - mise.toml
      - .github/workflows/runtime-test.yaml
  workflow_call:
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  runtime_test:
    name: Runtime Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build-package
      - name: Runtime Test (node)
        run: bun run runtime-test node
      - name: Runtime Test (bun)
        run: bun run runtime-test bun
      - name: Runtime Test (deno)
        run: bun run runtime-test deno
