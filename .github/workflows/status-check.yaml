name: Status check
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  status-check:
    uses: cffnpwr/actions/.github/workflows/status-check.yaml@28b9fc713f2f1f49bd979b6c6c6922b1b0c8d48b # main
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
