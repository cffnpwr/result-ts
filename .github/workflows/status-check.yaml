name: Status check
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  status-check:
    uses: cffnpwr/actions/.github/workflows/status-check.yaml@680e0f250b000643aafde886f3caa6603c9c8335 # main
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
