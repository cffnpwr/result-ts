name: GitHub Actions Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    uses: cffnpwr/actions/.github/workflows/github-actions-lint.yaml@8db4f44a1551182f4d67241943047c5f5c8cf4cc # main
    permissions:
      contents: read
