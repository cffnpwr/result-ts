name: GitHub Actions Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    uses: cffnpwr/actions/.github/workflows/github-actions-lint.yaml@c80893822eee82c32d5ab76014ed5b35ee61fed4 # main
    permissions:
      contents: read
