name: GitHub Actions Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    uses: cffnpwr/actions/.github/workflows/github-actions-lint.yaml@837b909f3aaef8a97733d8f31426130c9242b08c # main
    permissions:
      contents: read
